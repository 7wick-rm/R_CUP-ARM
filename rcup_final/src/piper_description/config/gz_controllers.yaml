piper/controller_manager:
  ros__parameters:
    update_rate: 100
    
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    claw_controller:
      type: joint_trajectory_controller/JointTrajectoryController

piper/joint_trajectory_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

piper/claw_controller:
  ros__parameters:
    joints:
      - gripper_joint
      - mimic_gripper_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity